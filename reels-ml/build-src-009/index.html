<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"ML";src:url("fonts/noto800.woff2") format("woff2");font-weight:800}
html,body{margin:0;background:#000}
svg{display:block}
text{font-family:"ML",sans-serif;font-weight:800}
</style></head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
const NAVY="#1B2A41", YEL="#F2B705", TEAL="#1B9AAA", CORAL="#EF476F", CREAM="#FFF4E0", SKIN="#E8B98A";
let TL=null, EV=null;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const easeOut=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;

function stickman(x,gy,o={}){
  const INK=o.ink||NAVY, TOWEL=o.towel!==false, SK=o.skin||SKIN, s=o.scale||1, look=o.look||0, mood=o.mood||"smile", al=o.al??18, ar=o.ar??-18, walk=o.walk||0, bob=o.bob||0;
  const arm=(sx,sy,deg)=>{const r=deg*Math.PI/180;return `M${sx},${sy} L${sx+Math.sin(r)*150},${sy+Math.cos(r)*150}`};
  const hipY=-190, shY=-362;
  const legA=Math.sin(walk)*22+9, legB=-Math.sin(walk)*22-9;
  const leg=(d)=>`M0,${hipY} L${Math.sin(d*Math.PI/180)*95+0},${hipY+Math.cos(d*Math.PI/180)*190}`;
  const mouth = mood==="smile"?`<path d="M-16,-410 Q0,-390 16,-410" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>`
    : mood==="open"?`<ellipse cx="0" cy="-404" rx="11" ry="14" fill="${INK}"/>`
    : mood==="sad"?`<path d="M-14,-398 Q0,-412 14,-398" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>`
    : `<path d="M-12,-402 L12,-402" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>`;
  const ex=look*7;
  return `<g transform="translate(${x},${gy+bob}) scale(${s})" stroke-linecap="round" stroke-linejoin="round">
   <path d="${leg(legA)}" stroke="${INK}" stroke-width="13" fill="none"/>
   <path d="${leg(legB)}" stroke="${INK}" stroke-width="13" fill="none"/>
   <path d="M0,${hipY} L0,${shY}" stroke="${INK}" stroke-width="13" fill="none"/>
   <path d="${arm(0,shY+6,al)}" stroke="${INK}" stroke-width="12" fill="none"/>
   <path d="${arm(0,shY+6,ar)}" stroke="${INK}" stroke-width="12" fill="none"/>
   ${TOWEL?`<path d="M-34,${shY-4} L36,${shY+52}" stroke="${YEL}" stroke-width="26" fill="none"/>`:""}
   ${TOWEL?`<path d="M30,${shY+44} L44,${shY+96}" stroke="${YEL}" stroke-width="20" fill="none"/>`:""}
   <circle cx="0" cy="-452" r="52" fill="${SK}" stroke="${INK}" stroke-width="10"/>
   <circle cx="0" cy="-516" r="17" fill="${INK}"/>
   <path d="M-8,-504 L0,-500 L8,-504" stroke="${INK}" stroke-width="8" fill="none"/>
   <circle cx="${-21}" cy="-454" r="15" fill="#fff" stroke="${INK}" stroke-width="5"/>
   <circle cx="${21}" cy="-454" r="15" fill="#fff" stroke="${INK}" stroke-width="5"/>
   <path d="M-6,-454 L6,-454" stroke="${INK}" stroke-width="5"/>
   <circle cx="${-21+ex}" cy="-454" r="5" fill="${INK}"/><circle cx="${21+ex}" cy="-454" r="5" fill="${INK}"/>
   <g transform="translate(0,-4)">${mouth}</g>
  </g>`;
}
function handPos(x,gy,scale,deg,side){ // approx hand position of an arm
  const r=deg*Math.PI/180, s=scale||1;
  return {x:x+Math.sin(r)*150*s, y:gy+(-362+6+Math.cos(r)*150)*s};
}
function coin(x,y,r=22,a=1){return `<g opacity="${a}"><circle cx="${x}" cy="${y}" r="${r}" fill="${YEL}" stroke="#B8860B" stroke-width="5"/><text x="${x}" y="${y+r*0.35}" font-size="${r*1.1}" text-anchor="middle" fill="#B8860B" stroke="none">₹</text></g>`}
function phone(x,y,w=130,h=250,rot=0,col=CORAL){return `<g transform="translate(${x},${y}) rotate(${rot})"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="22" fill="${NAVY}"/><rect x="${-w/2+8}" y="${-h/2+14}" width="${w-16}" height="${h-28}" rx="14" fill="${col}"/><circle cx="0" cy="${-h/2+7}" r="3" fill="#fff"/><rect x="${-w/4}" y="${-h/6}" width="${w/2}" height="${h/6}" rx="10" fill="#ffffff55"/></g>`}
function bubbleQ(x,y,sc=1){return `<g transform="translate(${x},${y}) scale(${sc})"><circle r="52" fill="#fff" stroke="${NAVY}" stroke-width="8"/><text y="26" font-size="76" text-anchor="middle" fill="${CORAL}" stroke="none">?</text></g>`}
function pill(text,x,y,col=CORAL,fs=44){const w=text.length*fs*0.72+70;return `<g transform="translate(${x},${y})"><rect x="${-w/2}" y="-38" width="${w}" height="76" rx="26" fill="${col}" stroke="${NAVY}" stroke-width="6"/><text y="15" font-size="${fs}" text-anchor="middle" fill="#fff" stroke="none">${text}</text></g>`}
function outlined(text,x,y,fs,fill="#fff",sw=14,anchor="middle"){return `<text x="${x}" y="${y}" font-size="${fs}" text-anchor="${anchor}" fill="${fill}" stroke="${NAVY}" stroke-width="${sw}" paint-order="stroke" stroke-linejoin="round">${text}</text>`}

function S(sec,k){return TL.items.filter(i=>i.sec===sec)[k]}
function sceneOf(t){
  const first={}; TL.items.forEach(i=>{if(first[i.sec]===undefined) first[i.sec]=i.start});
  const order=["hook","s1","s2","s3","s4","s5","close","disc"];
  let cur="hook";
  for(const k of order){ if(t>=first[k]-0.15) cur=k; }
  return {id:cur,t0:first[cur]};
}

function bg(id,t){
  const pal={hook:["#9ED8F2","#E6F4FA"],s1:["#CDEAF5","#FFF4E0"],s2:["#FFE9B8","#FFF4E0"],s3:["#BFE8E2","#FFF4E0"],s4:["#E3DCF5","#FFF4E0"],s5:["#FFD3DE","#FFF4E0"],close:["#C9C2F0","#F3E9FF"],disc:["#1B2A41","#2E4463"]}[id];
  let o=`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal[0]}"/><stop offset="1" stop-color="${pal[1]}"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#g)"/>`;
  if(id!=="disc"){
    o+=`<circle cx="900" cy="470" r="70" fill="#FFE27A" opacity=".9"/>`;
    o+=`<rect x="0" y="1180" width="1080" height="740" fill="#8C4A2F"/><rect x="0" y="1180" width="1080" height="18" fill="#A85D3B"/>`;
  }
  return o;
}

function render(t){
  const sc=sceneOf(t), id=sc.id, lt=t-sc.t0, svg=document.getElementById("s");
  const zoom=1+0.035*clamp((t-sc.t0)/6);
  let b=bg(id,t), fg="", top="", gy=1180;
  const idle=Math.sin(t*3)*4;


  const at=(sec,k,f=0)=>{const i=S(sec,k);return i.start+f*(i.end-i.start)};
  const plate=(x,y,sc,op=1)=>`<g transform="translate(${x},${y}) scale(${sc})" opacity="${op}"><ellipse cx="0" cy="0" rx="200" ry="46" fill="#fff" stroke="${NAVY}" stroke-width="8"/><path d="M-150,-4 Q-130,-150 0,-170 Q130,-150 150,-4 Z" fill="#F2A33A" stroke="${NAVY}" stroke-width="8"/><ellipse cx="-50" cy="-90" rx="34" ry="24" fill="#8B4513" stroke="${NAVY}" stroke-width="6"/><ellipse cx="55" cy="-70" rx="30" ry="22" fill="#8B4513" stroke="${NAVY}" stroke-width="6"/></g>`;
  const xmark=(x,y,sc)=>`<g transform="translate(${x},${y}) scale(${sc})"><path d="M-60,-60 L60,60 M60,-60 L-60,60" stroke="${CORAL}" stroke-width="22" stroke-linecap="round"/></g>`;
  const tick=(x,y,sc)=>`<g transform="translate(${x},${y}) scale(${sc})"><path d="M-50,0 L-15,40 L55,-50" fill="none" stroke="#2BB673" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  const jar=(x,y,sc,n)=>{let c="";for(let i=0;i<n;i++){c+=coin(-40+(i%3)*40,120-Math.floor(i/3)*44,20)}return `<g transform="translate(${x},${y}) scale(${sc})"><path d="M-110,-170 L-110,110 Q-110,160 -60,160 L60,160 Q110,160 110,110 L110,-170 Z" fill="#ffffff77" stroke="${NAVY}" stroke-width="9"/><rect x="-122" y="-192" width="244" height="30" rx="8" fill="${NAVY}"/>${c}</g>`};
  const bike=(x,y,sc)=>`<g transform="translate(${x},${y}) scale(${sc})" stroke="${NAVY}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="-110" cy="0" r="62"/><circle cx="110" cy="0" r="62"/><path d="M-110,0 L-30,-110 L70,-110 L110,0 M-30,-110 L10,0 L-110,0 M70,-110 L60,-150 L100,-150" /><path d="M-30,-110 L-50,-130 L-10,-130" /></g>`;
  const cloud=(x,y,sc)=>`<g transform="translate(${x},${y}) scale(${sc})"><ellipse cx="0" cy="0" rx="130" ry="60" fill="#5B6B80" stroke="${NAVY}" stroke-width="7"/><ellipse cx="-70" cy="30" rx="80" ry="48" fill="#5B6B80"/><ellipse cx="70" cy="30" rx="80" ry="48" fill="#5B6B80"/><path d="M0,60 L-24,130 L10,120 L-14,190" fill="none" stroke="${YEL}" stroke-width="14" stroke-linejoin="round"/></g>`;
  const card=(x,y,a,inner,label)=>`<g transform="translate(${x},${y}) scale(${a})"><rect x="-170" y="-170" width="340" height="340" rx="26" fill="#fff" stroke="${NAVY}" stroke-width="9"/>${inner}${outlined(label,0,140,64,CORAL,10)}</g>`;

  const meter=(x,y,w,f)=>`<g transform="translate(${x},${y})"><rect x="${-w/2}" y="-34" width="${w}" height="68" rx="16" fill="#fff" stroke="${NAVY}" stroke-width="8"/><rect x="${-w/2+8}" y="-26" width="${Math.max(0,(w-16)*f)}" height="52" rx="10" fill="${f>0.5?TEAL:(f>0.2?YEL:CORAL)}"/></g>`;
  const cal=(x,y,num,sc=1)=>`<g transform="translate(${x},${y}) scale(${sc})"><rect x="-110" y="-110" width="220" height="230" rx="20" fill="#fff" stroke="${NAVY}" stroke-width="8"/><rect x="-110" y="-110" width="220" height="62" rx="20" fill="${CORAL}" stroke="${NAVY}" stroke-width="8"/>${outlined("മാസം 3",0,-62,34,"#fff",6)}<text y="82" font-size="104" text-anchor="middle" fill="${NAVY}" stroke="none">${num}</text></g>`;
  const cup=(x,y,sc)=>`<g transform="translate(${x},${y}) scale(${sc})"><path d="M-50,-50 H50 L40,50 Q38,70 20,70 H-20 Q-38,70 -40,50 Z" fill="#C8873F" stroke="${NAVY}" stroke-width="8"/><path d="M50,-30 Q95,-30 90,10 Q85,35 45,30" fill="none" stroke="${NAVY}" stroke-width="8"/><path d="M-15,-70 q-10,-20 0,-40 M15,-70 q-10,-20 0,-40" fill="none" stroke="#999" stroke-width="7" stroke-linecap="round"/></g>`;
  const bag=(x,y,sc)=>`<g transform="translate(${x},${y}) scale(${sc})"><rect x="-60" y="-40" width="120" height="110" rx="10" fill="${CORAL}" stroke="${NAVY}" stroke-width="8"/><path d="M-30,-40 Q-30,-90 0,-90 Q30,-90 30,-40" fill="none" stroke="${NAVY}" stroke-width="8"/></g>`;
  const snack=(x,y,sc)=>`<g transform="translate(${x},${y}) scale(${sc})"><path d="M-55,-60 L55,-60 L48,60 L-48,60 Z" fill="${YEL}" stroke="${NAVY}" stroke-width="8"/><path d="M-55,-60 l11,-14 l11,14 l11,-14 l11,14 l11,-14 l11,14 l11,-14 l11,14 l11,-14" fill="none" stroke="${NAVY}" stroke-width="8"/></g>`;
  const house=(x,y,sc)=>`<g transform="translate(${x},${y}) scale(${sc})"><path d="M-60,0 L0,-60 L60,0 V60 H-60 Z" fill="#F8E2B0" stroke="${NAVY}" stroke-width="8" stroke-linejoin="round"/><rect x="-14" y="10" width="28" height="50" fill="${CORAL}"/></g>`;
  const bus=(x,y,sc)=>`<g transform="translate(${x},${y}) scale(${sc})"><rect x="-70" y="-40" width="140" height="80" rx="14" fill="${TEAL}" stroke="${NAVY}" stroke-width="8"/><rect x="-52" y="-24" width="30" height="26" fill="#E8F4FA"/><rect x="-12" y="-24" width="30" height="26" fill="#E8F4FA"/><circle cx="-38" cy="46" r="14" fill="${NAVY}"/><circle cx="38" cy="46" r="14" fill="${NAVY}"/></g>`;
  const laptop=(x,y,sc,prog)=>`<g transform="translate(${x},${y}) scale(${sc})"><rect x="-170" y="-130" width="340" height="220" rx="16" fill="${NAVY}"/><rect x="-154" y="-114" width="308" height="170" rx="8" fill="#fff"/><path d="M-26,-92 L34,-58 L-26,-24 Z" fill="${CORAL}"/><rect x="-130" y="20" width="260" height="14" rx="7" fill="#ddd"/><rect x="-130" y="20" width="${260*prog}" height="14" rx="7" fill="#2BB673"/><path d="M-200,90 H200 L170,120 H-170 Z" fill="#9AA5B1" stroke="${NAVY}" stroke-width="7"/></g>`;
  const plant=(x,y,g)=>{const h=40+g*300;let o=`<g transform="translate(${x},${y})"><path d="M-40,0 H40 L30,50 H-30 Z" fill="#B5651D" stroke="${NAVY}" stroke-width="7"/><path d="M0,0 L0,${-h}" stroke="#2BB673" stroke-width="14" stroke-linecap="round"/>`;
    for(let i=0;i<4;i++){const f=(i+1)/5; if(g>f*0.9){const yy=-h*f; const d=i%2?1:-1; o+=`<ellipse cx="${d*34}" cy="${yy}" rx="36" ry="17" fill="#2BB673" stroke="${NAVY}" stroke-width="5" transform="rotate(${d*-25} ${d*34} ${yy})"/>`}}
    if(g>0.92) o+=coin(0,-h-34,30);
    return o+`</g>`};
  const burst=(x,y,sc,txt)=>{let p="";for(let i=0;i<24;i++){const r=i%2?120:160,an=i/24*Math.PI*2;p+=`${i?"L":"M"}${Math.cos(an)*r},${Math.sin(an)*r} `}return `<g transform="translate(${x},${y}) scale(${sc})"><path d="${p}Z" fill="${YEL}" stroke="${NAVY}" stroke-width="8" stroke-linejoin="round"/>${outlined(txt[0],0,-8,44,NAVY,0)}${outlined(txt[1],0,44,44,CORAL,0)}</g>`};
  const mag=(x,y,sc)=>`<g transform="translate(${x},${y}) scale(${sc})"><circle r="80" fill="#ffffff55" stroke="${NAVY}" stroke-width="14"/><path d="M56,56 L120,120" stroke="${NAVY}" stroke-width="18" stroke-linecap="round"/></g>`;

  const WD=(sec,k,i)=>S(sec,k).words[i].start;
  if(id==="hook"){
    const e0=at("hook",1,0);
    top+=outlined("6 മാസം കഴിഞ്ഞ്",540,345,70);
    top+=outlined("ഇപ്പോൾ?",540,450,70,"#9BE564");
    fg+=`<g transform="translate(360,640)">${pill("അന്ന്",0,0,"#6A4C93",36)}</g><g transform="translate(790,640)">${pill("ഇപ്പോൾ",0,0,TEAL,36)}</g>`;
    fg+=cal(360,800,15,0.85)+meter(360,1010,360,0.04);
    fg+=outlined("0",360,1090,52,CORAL,8);
    fg+=cal(790,800,15,0.85)+meter(790,1010,360,0);
    if(t>e0-0.1) fg+=bubbleQ(790,1010,back((t-e0+0.1)/0.35)*1.1);
    fg+=stickman(120,gy,{al:40,ar:-14,bob:idle,look:1,mood:t>e0?"smile":"neutral",scale:0.85});
  } else if(id==="s1"){
    top+=pill("എൻ്റെ സ്വന്തം രീതി",540,350,TEAL,38)+outlined("ശമ്പളത്തിന് ഒരു സ്പ്ലിറ്റ്",540,470,58);
    const x0=230,W=760;
    const mk=(segs,y,h)=>{let x=x0,o="";segs.forEach(([p,col,show])=>{const ww=W*p/100;if(show){o+=`<rect x="${x}" y="${y}" width="${ww}" height="${h}" fill="${col}" stroke="${NAVY}" stroke-width="6"/>`}x+=ww});return o};
    if(t<at("s1",2,0)){
      fg+=mk([[50,TEAL,1],[30,CORAL,1],[20,YEL,1]],820,90)+outlined("50 · 30 · 20",610,880,46,"#fff",6);
      if(t>at("s1",0,0.55)) fg+=xmark(610,865,back((t-at("s1",0,0.55))/0.35)*1.1);
      if(t>at("s1",1,0)) fg+=`<g transform="translate(610,1010) scale(${back((t-at("s1",1,0))/0.35)})">${pill("എൻ്റെ ശമ്പളത്തിൽ പറ്റില്ല",0,0,NAVY,34)}</g>`;
    } else {
      const keys=[0,3,5,8,10], cols=[TEAL,CORAL,"#2BB673","#6A4C93",YEL], labs=["ആവശ്യം 60%","ആഗ്രഹം 20%","എമർജൻസി ഫണ്ട് 10%","അപ്സ്കില്ലിങ് 5%","ബാക്കി 5%"], ps=[60,20,10,5,5];
      const segs=ps.map((p,i)=>[p,cols[i],t>WD("s1",2,keys[i])]);
      fg+=mk(segs,800,90);
      for(let i=0;i<5;i++){ if(t>WD("s1",2,keys[i])){const q=back((t-WD("s1",2,keys[i]))/0.35);fg+=`<g transform="translate(300,${940+i*58}) scale(${q})"><rect x="-24" y="-22" width="44" height="44" rx="8" fill="${cols[i]}" stroke="${NAVY}" stroke-width="5"/>${outlined(labs[i],40,13,38,NAVY,0,"start")}</g>`}}
    }
    fg+=stickman(120,gy,{al:50,ar:-14,bob:idle,look:1,mood:"smile",scale:0.85});
  } else if(id==="s2"){
    top+=pill("എമർജൻസി ഫണ്ട്",540,350,"#2BB673",40)+outlined("10% = ₹1,000 / മാസം",540,470,60);
    let n=0; for(let i=0;i<6;i++){ if(t>at("s2",1,0.08+0.16*i)+0.45) n=i+1 }
    fg+=jar(640,1010,0.95,Math.min(n*1,12));
    for(let i=0;i<6;i++){const c=at("s2",1,0.08+0.16*i), p=(t-c)/0.45; if(p>0&&p<1) fg+=coin(640,lerp(700,900,ease(p)),22)}
    if(n>0) fg+=`<g transform="translate(640,690)">${pill("₹"+(n*1000).toLocaleString("en-IN"),0,0,NAVY,50)}</g>`;
    if(t>at("s2",2,0.15)){const q=back((t-at("s2",2,0.15))/0.4);fg+=`<g transform="translate(640,775) scale(${q})">${pill("ഒരു മാസത്തെ ചെലവ് ✓",0,0,"#2BB673",36)}</g>`}
    fg+=stickman(170,gy,{al:t>at("s2",2,0)?150:40,ar:t>at("s2",2,0)?-150:-14,bob:idle,look:1,mood:"smile"});
  } else if(id==="s3"){
    top+=pill("അടുത്ത ലക്ഷ്യം",540,350,TEAL,40)+outlined("3 മാസത്തെ ചെലവ്",540,470,62);
    const bx=270,bw=240,by=900;
    for(let i=0;i<3;i++){const fill=(i===0&&t>at("s3",1,0.1))?"#2BB673":"#fff"; fg+=`<rect x="${bx+i*bw}" y="${by-60}" width="${bw}" height="120" fill="${fill}" stroke="${NAVY}" stroke-width="7"/>`+outlined("₹6,000",bx+i*bw+bw/2,by+14,40,fill==="#fff"?NAVY:"#fff",0)}
    if(t>at("s3",0,0.3)) fg+=`<g transform="translate(630,760) scale(${back((t-at("s3",0,0.3))/0.4)})">${pill("3 മാസം = ₹18,000",0,0,NAVY,44)}</g>`;
    if(t>at("s3",1,0.1)){const q=back((t-at("s3",1,0.1))/0.4);fg+=`<g transform="translate(630,1060) scale(${q})">${pill("മൂന്നിലൊന്ന് ✓",0,0,"#2BB673",48)}</g>`}
    fg+=stickman(130,gy,{al:50,ar:-14,bob:idle,look:1,mood:"smile",scale:0.9});
  } else if(id==="s4"){
    top+=pill("അപ്സ്കില്ലിങ്",540,350,"#6A4C93",42)+outlined("ശമ്പളം അതുതന്നെ, പക്ഷേ…",540,470,56);
    const f1=at("s4",1,0), f2=at("s4",2,0), f3=at("s4",3,0);
    fg+=laptop(700,1000,1,t>f1?clamp((t-f1)/(f2-f1)):0);
    const P=(x,y,txt,col,fs,t0)=>t>t0?`<g transform="translate(${x},${y}) scale(${back((t-t0)/0.4)})">${pill(txt,0,0,col,fs)}</g>`:"";
    if(t<f1) fg+=P(700,730,"₹500 × 6 = ₹3,000",CORAL,50,at("s4",0,0.1));
    else if(t<f2) fg+=P(700,730,"കോഴ്സ് ✓",  "#2BB673",56,f1);
    else if(t<f3) fg+=P(700,700,"ശമ്പളം: അതുതന്നെ",NAVY,42,f2)+P(700,800,"പ്രമോഷൻ ✗",CORAL,46,f2+0.9);
    else fg+=P(700,730,"പുതിയ കാര്യം ⭐","#2BB673",50,f3);
    if(t>f3) fg+=plant(940,gy-10,clamp((t-f3)/2.2));
    fg+=stickman(190,gy,{al:t>f3?150:40,ar:-14,bob:idle,look:1,mood:"smile"});
  } else if(id==="s5"){
    top+=pill("ഇപ്പോൾ",540,350,TEAL,42)+outlined("പതിനഞ്ചിന് തീരുന്നില്ല",540,470,58);
    fg+=cal(520,790,16,0.9)+meter(520,1030,520,0.6)+tick(720,800,0.9);
    if(t>at("s5",1,0)){const a=back((t-at("s5",1,0))/0.4);fg+=plate(880,1010,0.38*a)+`<g transform="translate(880,820) scale(${a})"><circle r="46" fill="#fff" stroke="${NAVY}" stroke-width="7"/>${outlined("?",0,20,58,CORAL,0)}</g>`}
    if(t>at("s5",2,0.1)){const a=back((t-at("s5",2,0.1))/0.4);fg+=`<g transform="translate(820,1110) scale(${a})">${pill("× 2 / മാസം",0,0,CORAL,44)}</g>`}
    if(t>at("s5",3,0.1)){const a=back((t-at("s5",3,0.1))/0.4);fg+=`<g transform="translate(440,1190) scale(${a})">${pill("ആഗ്രഹത്തിന് പരിധി",0,0,NAVY,38)}</g>`}
    fg+=stickman(130,gy,{al:105,ar:-105,bob:idle,look:1,mood:"smile",scale:0.9});
  } else if(id==="close"){
    const c0=at("close",0,0), c1=at("close",1,0), c2=at("close",2,0);
    const C=(x,t0,inner,label,col)=>t>t0?`<g transform="translate(${x},760) scale(${back((t-t0)/0.4)})"><circle r="105" fill="#fff" stroke="${NAVY}" stroke-width="8"/>${inner}</g><g transform="translate(${x},930) scale(${back((t-t0)/0.4)})">${pill(label,0,0,col,38)}</g>`:"";
    fg+=C(390,c0,`<rect x="-52" y="-48" width="104" height="100" rx="12" fill="${CREAM}" stroke="${NAVY}" stroke-width="7"/><rect x="-52" y="-48" width="104" height="30" rx="12" fill="${CORAL}" stroke="${NAVY}" stroke-width="7"/>${outlined("6",0,40,48,NAVY,0)}`,"6 മാസം",CORAL);
    fg+=C(640,c1,`<rect x="-56" y="-50" width="112" height="100" fill="#fff" stroke="${NAVY}" stroke-width="7"/><path d="M-56,-18 H56 M-56,16 H56 M-18,-50 V50 M20,-50 V50" stroke="${TEAL}" stroke-width="6"/>`,"1 ഷീറ്റ്",TEAL);
    fg+=C(890,c2,`<circle r="52" fill="none" stroke="#2BB673" stroke-width="12"/>${`<path d="M-26,2 L-6,24 L30,-22" fill="none" stroke="#2BB673" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>`}`,"1 ശീലം","#2BB673");
    fg+=stickman(130,gy,{al:105,ar:-105,bob:idle,look:1,mood:"smile",scale:0.9});
    top+=outlined("ആറ് മാസം",540,400,76)+(t>c1?outlined("ഒരു ഷീറ്റ്. ഒരു ശീലം.",540,505,66,"#9BE564"):"");
  } else {
    const a=ease(lt/0.5);
    fg+=`<g opacity="${a}">`+outlined("ഒരു ഉദാഹരണം മാത്രം",540,860,76,"#fff",10)+outlined("ഉപദേശമല്ല",540,970,76,YEL,10)+outlined("ഫോളോ ചെയ്യൂ",540,1160,64,"#fff",8)+`</g>`;
  }
  // tag (small disclaimer, top safe area) except end card
  let tag="";
  if(id!=="disc") tag=`<g transform="translate(540,560)">${`<rect x="-290" y="-30" width="580" height="58" rx="29" fill="#00000077"/><text y="10" font-size="32" text-anchor="middle" fill="#fff" stroke="none">ഒരു ഉദാഹരണം · ഉപദേശമല്ല</text>`}</g>`;
  // captions
  let cap="";
  const cur=id==='disc'?null:TL.items.find(i=>t>=i.start-0.02&&t<=i.end+0.12);
  if(cur){
    const words=cur.text.replace(/[.?]/g,"").trim().split(/\s+/);
    const chunks=[]; let c=[];
    for(const w of words){const next=[...c,w].join(" "); if(c.length&&(next.length>22||c.length>=3)){chunks.push(c.join(" "));c=[w]} else c.push(w)}
    if(c.length) chunks.push(c.join(" "));
    const tot=chunks.reduce((s,x)=>s+x.length,0); let acc=0, idx=chunks.length-1;
    const p=clamp((t-cur.start)/(cur.end-cur.start));
    for(let i=0;i<chunks.length;i++){acc+=chunks[i].length/tot; if(p<=acc){idx=i;break}}
    const txt=chunks[idx]+(cur.text.endsWith("?")&&idx===chunks.length-1?"?":"");
    cap=outlined(txt,540,1300,60,"#fff",15);
  }
  svg.innerHTML=`<g transform="translate(540,960) scale(${zoom}) translate(-540,-960)">${b}${fg}</g>${top}${tag}${cap}`;
}
window.init=async(tl,ev)=>{TL=tl;EV=ev;await document.fonts.load('800 60px ML','ആദ്യ');await document.fonts.ready;};
window.render=render;
</script></body></html>
