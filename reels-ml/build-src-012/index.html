<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
const NAVY="#1B2A41", YEL="#F2B705", TEAL="#2F9AA6", CORAL="#EF476F", CREAM="#FFF4E0", INK="#1C1512", GREEN="#2BB673";
const SK={s1:{b:"#D9A47A",d:"#BF8A62",l:"#E6B88F"},s2:{b:"#C28E67",d:"#A87650",l:"#D2A27C"},s3:{b:"#A67B5B",d:"#8C6446",l:"#B88E6C"}};
let TL=null, EV=null, ENV=null;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const back=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const S=(sec,k)=>TL.items.filter(i=>i.sec===sec)[k];
const at=(sec,k,f=0)=>{const i=S(sec,k);return i.start+f*(i.end-i.start)};
const WF=(sec,k,pre)=>{const w=S(sec,k).words.find(w=>w.text.startsWith(pre));return w?w.start:S(sec,k).start};
function outlined(text,x,y,fs,fill="#fff",sw=12,anchor="middle"){return `<text x="${x}" y="${y}" font-size="${fs}" text-anchor="${anchor}" fill="${fill}" stroke="${NAVY}" stroke-width="${sw}" paint-order="stroke" stroke-linejoin="round">${text}</text>`}
function plain(text,x,y,fs,fill=NAVY,anchor="middle"){return `<text x="${x}" y="${y}" font-size="${fs}" text-anchor="${anchor}" fill="${fill}" stroke="none">${text}</text>`}
function pill(text,x,y,col=CORAL,fs=44,tc="#fff"){const w=text.length*fs*0.72+70;return `<g transform="translate(${x},${y})"><rect x="${-w/2}" y="${-fs*0.85}" width="${w}" height="${fs*1.7}" rx="${fs*0.6}" fill="${col}"/>${plain(text,0,fs*0.33,fs,tc)}</g>`}
function coin(x,y,r=22,a=1){return `<g opacity="${a}"><circle cx="${x}" cy="${y}" r="${r}" fill="${YEL}"/><circle cx="${x}" cy="${y}" r="${r*0.78}" fill="none" stroke="#C99A07" stroke-width="${r*0.12}"/><text x="${x}" y="${y+r*0.36}" font-size="${r*1.05}" text-anchor="middle" fill="#B8860B" stroke="none">₹</text></g>`}
const gloss=(d)=>`<path d="${d}" fill="#fff" opacity=".28"/>`;
const sh=(rx,ry,x=0,y=0)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#000" opacity=".12"/>`;

// ---------------- character ----------------
function hand(flip,c){const f=flip?-1:1;return `<g transform="translate(0,-4) scale(${f},-1)">
 <path d="M-8,-10 Q-10,8 -4,14 L6,14 Q11,6 9,-10Z" fill="${c.b}"/>
 <path d="M-8,-10 L-7,-24 Q-6,-27 -3,-24 L-2,-10Z M-2,-10 L-1,-27 Q0,-30 3,-27 L3,-10Z M3,-10 L5,-26 Q7,-28 9,-25 L8,-10Z" fill="${c.b}"/>
 <path d="M8,-6 L15,-16 Q18,-14 16,-10 L10,2Z" fill="${c.b}"/>
 <path d="M3,-8 Q6,6 4,14 L9,10 Q12,0 9,-10Z" fill="${c.d}" opacity=".35"/></g>`}
function sneaker(x,flip){const f=flip?-1:1;return `<g transform="translate(${x},0) scale(${f},1)">
 <path d="M-22,-30 L8,-30 L10,-14 Q24,-10 28,-2 Q28,4 20,4 L-24,4 Q-26,-12 -22,-30Z" fill="#F7F4EC"/>
 <path d="M-24,0 L26,0 Q28,4 20,6 L-24,6Z" fill="#D8D2C4"/><path d="M8,-14 Q22,-10 28,-2 Q20,-6 8,-6Z" fill="#E9E4D6"/>
 <path d="M-14,-30 L-14,-18 M-6,-30 L-6,-16 M2,-28 L2,-15" stroke="#B9B2A0" stroke-width="2" fill="none"/>
 <path d="M-22,-30 L8,-30 L8,-25 L-22,-25Z" fill="#E2DDCF"/></g>`}
function face(ex,sk,open,blink){
  const c=SK[sk];
  const brow={neutral:["M-24,-20 Q-15,-24 -7,-21","M7,-21 Q15,-24 24,-20"],smile:["M-24,-21 Q-15,-26 -7,-22","M7,-22 Q15,-26 24,-21"],
   worried:["M-24,-16 Q-15,-24 -7,-23","M7,-23 Q15,-24 24,-16"],surprised:["M-24,-27 Q-15,-33 -7,-28","M7,-28 Q15,-33 24,-27"],
   thinking:["M-24,-19 Q-15,-23 -7,-20","M7,-26 Q15,-30 24,-24"],laugh:["M-24,-22 Q-15,-27 -7,-23","M7,-23 Q15,-27 24,-22"]}[ex]||["M-24,-20 Q-15,-24 -7,-21","M7,-21 Q15,-24 24,-20"];
  const closed=blink||ex==="laugh";
  const eye=(x)=>closed?`<path d="M${x-9},-3 Q${x},${blink?-1:-12} ${x+9},-3" fill="none" stroke="${INK}" stroke-width="2.8" stroke-linecap="round"/>`:
   `<ellipse cx="${x}" cy="-3" rx="9.5" ry="${ex==="surprised"?9.5:7.6}" fill="#fff"/><circle cx="${x+(ex==="thinking"?3:0.8)}" cy="${ex==="thinking"?-5.5:-3}" r="5.6" fill="#3B2A20"/><circle cx="${x+(ex==="thinking"?3:0.8)}" cy="${ex==="thinking"?-5.5:-3}" r="3" fill="#000"/><circle cx="${x+3}" cy="-5.6" r="1.6" fill="#fff"/><path d="M${x-9.5},-3 Q${x},${ex==="surprised"?-17:-12.5} ${x+9.5},-3" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`;
  const up=ex==="smile"||ex==="laugh"?3:(ex==="worried"?-3:0);
  const y0=26-up, w=8+open*5, h=open*13;
  let mouth;
  if(ex==="surprised") mouth=`<ellipse cx="0" cy="28" rx="${6.5+open*2}" ry="${8.5+open*3}" fill="#5A2A24"/>`;
  else if(open<0.07){
    mouth= ex==="smile"||ex==="laugh"?`<path d="M-12,${y0-1} Q0,${y0+9} 12,${y0-1}" fill="none" stroke="#7A3B30" stroke-width="2.7" stroke-linecap="round"/>`
         : ex==="worried"?`<path d="M-9,${y0+4} Q0,${y0-4} 9,${y0+4}" fill="none" stroke="#7A3B30" stroke-width="2.7" stroke-linecap="round"/>`
         : `<path d="M-8,${y0} Q0,${y0+2} 8,${y0}" fill="none" stroke="#7A3B30" stroke-width="2.7" stroke-linecap="round"/>`;
  } else {
    const th=Math.min(5,h*0.6);
    mouth=`<path d="M${-w},${y0} Q0,${y0+h*1.9+2} ${w},${y0} Q0,${y0-h*0.15-1} ${-w},${y0}Z" fill="#5A2A24"/>`+
      (open>0.3?`<path d="M${-w*0.78},${y0+0.4} Q0,${y0-0.2} ${w*0.78},${y0+0.4} L${w*0.7},${y0+th} Q0,${y0+th+1} ${-w*0.7},${y0+th}Z" fill="#fff"/>`:"")+
      (open>0.55?`<ellipse cx="0" cy="${y0+h*1.25}" rx="${w*0.5}" ry="${h*0.28}" fill="#C0584C"/>`:"");
  }
  return `<g>
   <ellipse cx="-38" cy="4" rx="5.5" ry="9" fill="${c.d}"/><ellipse cx="38" cy="4" rx="5.5" ry="9" fill="${c.d}"/>
   <path d="M-38,-10 C-38,-42 -21,-47 0,-47 C21,-47 38,-42 38,-10 C38,16 27,38 0,44 C-27,38 -38,16 -38,-10Z" fill="${c.b}"/>
   <path d="M22,-42 C32,-34 38,-24 38,-10 C38,16 27,38 0,44 C14,32 22,12 22,-8 C22,-24 24,-34 22,-42Z" fill="${c.d}" opacity=".08"/>
   <ellipse cx="-14" cy="-26" rx="16" ry="5" fill="${c.l}" opacity=".35"/>
   <path d="M-43,-6 C-52,-46 -26,-66 4,-65 C34,-65 54,-48 43,-4 C42,-18 36,-28 26,-32 C20,-44 4,-44 -12,-38 C-26,-34 -38,-24 -43,-6Z" fill="#17100D"/>
   <path d="M-30,-34 C-14,-52 14,-52 32,-40" fill="none" stroke="#6A5A54" stroke-width="3" opacity=".55" stroke-linecap="round"/>
   <path d="M-12,-38 C0,-44 14,-42 24,-34 C14,-38 2,-36 -12,-38Z" fill="#17100D"/>
   <ellipse cx="-23" cy="15" rx="10" ry="6.5" fill="#E07A68" opacity=".3"/><ellipse cx="23" cy="15" rx="10" ry="6.5" fill="#E07A68" opacity=".3"/>
   ${eye(-15)}${eye(15)}
   <path d="${brow[0]}" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/><path d="${brow[1]}" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>
   <path d="M1,0 Q5,9 0,11" fill="none" stroke="${c.d}" stroke-width="2" stroke-linecap="round" opacity=".8"/><path d="M-4,12.5 Q0,14.5 4,12.5" fill="none" stroke="${c.d}" stroke-width="1.8" stroke-linecap="round"/>
   ${mouth}</g>`;
}
const propsMini={
  phone:()=>`<g><rect x="-17" y="-33" width="34" height="66" rx="6" fill="#1F2430"/><rect x="-14.5" y="-30" width="29" height="60" rx="4" fill="#2F6FD0"/><circle cx="0" cy="-6" r="7" fill="#fff"/></g>`
};
function arm(side,ang,o,c){
  const out=o.outfit==="office"; const sl=out?"#A9C1DE":(o.tee||"#2F9AA6"), sld=out?"#8FAACB":"#247C87"; const slv=out?50:46;
  const rot=-side*ang[0], er=side*ang[1];
  return `<g transform="translate(${side*58},-440) rotate(${rot})">
   <path d="M-14,-6 Q-15,${slv/2} -12,${slv} L12,${slv} Q15,${slv/2} 14,-6Z" fill="${sl}"/><rect x="-12" y="${slv-3}" width="24" height="6" fill="${sld}"/>
   <path d="M-10,${slv+3} L10,${slv+3} L9,80 L-9,80Z" fill="${side>0?c.d:c.b}"/>
   <g transform="translate(0,80) rotate(${er})">
    <path d="M-9.5,-2 L9.5,-2 L8,86 L-8,86Z" fill="${side>0?c.d:c.b}"/>
    ${out&&side<0?`<rect x="-10" y="64" width="20" height="11" rx="3" fill="#2A2A2E"/><circle cx="0" cy="69" r="4" fill="#C9D3E0"/>`:""}
    <g transform="translate(0,88)">${hand(side>0,c)}${(o.hold&&o.hold.side===side)?`<g transform="translate(0,${o.hold.dy||10}) rotate(${o.hold.rot||0})">${propsMini[o.hold.item]()}</g>`:""}</g>
   </g></g>`;
}
function legsTorso(o,c){
  const sdw=(d)=>`<path d="${d}" fill="#000" opacity=".11"/>`;
  if(o.outfit==="office"){
    const P="#454B5C",Pd="#363B49";
    return `<path d="M-48,-292 L-2,-292 L-8,-30 L-40,-30Z" fill="${P}"/><path d="M2,-292 L48,-292 L40,-30 L8,-30Z" fill="${P}"/><path d="M-2,-292 L2,-292 L0,-180Z" fill="${Pd}"/>
     <path d="M-24,-292 L-22,-60" stroke="#5A6174" stroke-width="2.5" fill="none"/><path d="M24,-292 L22,-60" stroke="#5A6174" stroke-width="2.5" fill="none"/>${sdw("M26,-292 L48,-292 L40,-30 L24,-30Z")}
     ${sneaker(-26,false)}${sneaker(26,true)}
     <path d="M-60,-446 Q-70,-440 -72,-412 L-62,-292 Q0,-280 62,-292 L72,-412 Q70,-440 60,-446 L22,-458 L-22,-458Z" fill="#A9C1DE"/>${sdw("M30,-452 Q66,-442 70,-412 L62,-292 Q40,-288 34,-290 Q50,-370 30,-452Z")}
     <path d="M-22,-458 L-2,-436 L-16,-428 L-26,-446Z" fill="#F3F7FB"/><path d="M22,-458 L2,-436 L16,-428 L26,-446Z" fill="#E4ECF5"/><path d="M0,-436 L0,-292" stroke="#8FAACB" stroke-width="3"/>
     ${[-410,-372,-334].map(y=>`<circle cx="0" cy="${y}" r="3" fill="#F3F7FB"/>`).join("")}
     <rect x="-52" y="-292" width="104" height="12" rx="3" fill="#2A2018"/><rect x="-9" y="-294" width="18" height="16" rx="2" fill="#C9A24B"/>
     <path d="M-24,-452 L-32,-420 L-32,-376" stroke="#1F6F8B" stroke-width="3" fill="none"/><path d="M24,-452 L32,-420 L32,-376" stroke="#1F6F8B" stroke-width="3" fill="none"/>
     <rect x="14" y="-378" width="34" height="44" rx="4" fill="#fff" stroke="#1F6F8B" stroke-width="2.5"/><rect x="20" y="-370" width="22" height="18" rx="2" fill="${c.b}"/>`;
  }
  const J="#44649A",Jd="#33507F",Jl="#6283B8", T=o.tee||"#2F9AA6";
  return `<path d="M-48,-292 L-2,-292 L-8,-30 L-42,-30Z" fill="${J}"/><path d="M2,-292 L48,-292 L42,-30 L8,-30Z" fill="${J}"/><path d="M-2,-292 L2,-292 L0,-170Z" fill="${Jd}"/>
   <path d="M-25,-290 L-24,-40" stroke="${Jl}" stroke-width="2" fill="none" stroke-dasharray="6 3"/><path d="M25,-290 L24,-40" stroke="${Jl}" stroke-width="2" fill="none" stroke-dasharray="6 3"/>
   <path d="M-44,-286 Q-26,-258 -8,-282" fill="none" stroke="${Jd}" stroke-width="3"/><path d="M44,-286 Q26,-258 8,-282" fill="none" stroke="${Jd}" stroke-width="3"/>
   <ellipse cx="-24" cy="-170" rx="14" ry="22" fill="${Jl}" opacity=".35"/><ellipse cx="25" cy="-170" rx="14" ry="22" fill="${Jl}" opacity=".3"/>${sdw("M28,-292 L48,-292 L42,-30 L26,-30Z")}
   ${sneaker(-26,false)}${sneaker(26,true)}
   <path d="M-58,-446 Q-68,-440 -70,-412 L-62,-292 Q0,-278 62,-292 L70,-412 Q68,-440 58,-446 L20,-458 Q0,-446 -20,-458Z" fill="${T}"/>${sdw("M28,-452 Q64,-442 68,-412 L62,-292 Q40,-288 34,-290 Q48,-370 28,-452Z")}
   <path d="M-20,-458 Q0,-440 20,-458 L20,-450 Q0,-432 -20,-450Z" fill="#000" opacity=".18"/>
   <path d="M-44,-338 Q-24,-322 -4,-338 M6,-372 Q26,-358 46,-372" fill="none" stroke="#000" stroke-width="2.5" opacity=".14"/>
   <path d="M-20,-454 Q-30,-420 -34,-386" fill="none" stroke="#F4F4F4" stroke-width="3" stroke-linecap="round"/><path d="M20,-454 Q30,-420 34,-386" fill="none" stroke="#F4F4F4" stroke-width="3" stroke-linecap="round"/>
   <circle cx="-34" cy="-382" r="5" fill="#F4F4F4"/><circle cx="34" cy="-382" r="5" fill="#F4F4F4"/>`;
}
function ramu(x,y,sc,opt){
  const o=Object.assign({outfit:"casual",sk:"s2",ex:"neutral",open:0,blink:false,tilt:0,L:[8,-4],R:[8,-4],flip:false,tee:null,hold:null,shadow:true},opt||{});
  const c=SK[o.sk];
  return `<g transform="translate(${x},${y}) scale(${o.flip?-sc:sc},${sc})">${o.shadow?sh(120,14,0,4):""}${legsTorso(o,c)}${arm(-1,o.L,o,c)}${arm(1,o.R,o,c)}
   <rect x="-13" y="-480" width="26" height="30" fill="${c.b}"/><path d="M-13,-472 Q0,-460 13,-472 L13,-480 L-13,-480Z" fill="${c.d}" opacity=".5"/>
   <g transform="translate(0,-470) rotate(${o.tilt}) translate(0,-42) scale(1.1)">${face(o.ex,o.sk,o.open,o.blink)}</g></g>`;
}
// talking state: mouth from audio envelope, blink schedule, gesture
function talk(t){
  const i=Math.round(t*30); const open=ENV&&ENV[i]!==undefined?ENV[i]:0;
  const bt=(t*0.9)%3.1; const blink=bt>2.96;
  return {open:open>0.08?open:0,blink};
}
function gestureR(t,k=0){return [38+22*Math.sin(t*1.9+k),-(60+35*Math.sin(t*1.3+k*2))]}
function gestureL(t,k=0){return [10+6*Math.sin(t*1.1+k),-6]}

const cal=(x,y,top,numTxt,sc=1)=>`<g transform="translate(${x},${y}) scale(${sc})"><rect x="-110" y="-110" width="220" height="230" rx="20" fill="#fff"/><rect x="-110" y="-110" width="220" height="62" rx="20" fill="${CORAL}"/>${plain(top,0,-62,28,"#fff")}${plain(numTxt,0,82,84,NAVY)}${gloss("M-110,-48 H-40 L-110,40Z")}</g>`;
// ================= v7: shot-based engine =================
function rng(seed){let s=seed;return ()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
const DEFS=`<defs>
 <linearGradient id="gp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B6170"/><stop offset=".5" stop-color="#3C4150"/><stop offset="1" stop-color="#262A35"/></linearGradient>
 <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9976A"/><stop offset="1" stop-color="#A9784F"/></linearGradient>
 <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EF476F" stop-opacity=".45"/><stop offset="1" stop-color="#EF476F" stop-opacity="0"/></linearGradient>
 <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2BB673" stop-opacity=".45"/><stop offset="1" stop-color="#2BB673" stop-opacity="0"/></linearGradient>
</defs>`;
function seriesData(n,seed,kind){
  const r=rng(seed);let c=100;const out=[];
  for(let i=0;i<n;i++){const o=c;
    if(kind==="crash"){ if(i<n*0.6) c+=(r()-0.38)*3.0+0.5; else c-=r()*2.2+1.4 } else c+=(r()-0.3)*2.2+0.55;
    out.push({o,c,h:Math.max(o,c)+r()*1.6,l:Math.min(o,c)-r()*1.6,v:0.3+r()*0.7});}
  if(kind==="crash"){let pk=0;out.forEach((d,i)=>{if(d.h>out[pk].h)pk=i});const peak=out[pk].c,fin=out[n-1].c,k=0.16*peak/(peak-fin);
    for(let i=pk+1;i<n;i++){const m=v=>peak-(peak-v)*k;const d=out[i];d.o=m(d.o);d.c=m(d.c);d.h=m(d.h);d.l=m(d.l)}}
  return out;}
const DATA_CRASH=seriesData(46,11,"crash"), DATA_UP=seriesData(16,5,"up");
function candleChart(x,y,w,h,data,p,opt){
  opt=opt||{}; const n=data.length,cw=w/n; const mn=Math.min(...data.map(d=>d.l)),mx=Math.max(...data.map(d=>d.h));
  const sy=v=>y+h*0.86-(v-mn)/(mx-mn)*h*0.74;
  let o="";
  for(let i=0;i<=5;i++){const gy=y+h*0.12+i*h*0.148;o+=`<path d="M${x},${gy} H${x+w}" stroke="#E6EAF0" stroke-width="2"/>`;const val=mx-(mx-mn)*(i/5)*0.98;o+=plain(Math.round(val*100/100*10)/10+"",x+w+10,gy+8,20,"#8A94A6","start")}
  const rev=p*n; const cnt=Math.floor(rev);
  data.forEach((d,i)=>{ if(i>cnt) return; const part=i===cnt?clamp(rev-cnt):1; const up=d.c>=d.o; const col=up?GREEN:CORAL;
    const cx=x+i*cw+cw/2; const cl=d.o+(d.c-d.o)*part; const hi=d.o+(d.h-d.o)*part, lo=d.o+(d.l-d.o)*part;
    const top=sy(Math.max(d.o,cl)), bot=sy(Math.min(d.o,cl));
    o+=`<path d="M${cx},${sy(hi)} V${sy(lo)}" stroke="${col}" stroke-width="3"/><rect x="${cx-cw*0.4}" y="${top}" width="${cw*0.8}" height="${Math.max(3,bot-top)}" rx="1.5" fill="${col}"/>`;
    o+=`<rect x="${cx-cw*0.34}" y="${y+h-14-d.v*h*0.12*part}" width="${cw*0.68}" height="${d.v*h*0.12*part}" fill="${col}" opacity=".35"/>`;});
  let ma="";data.forEach((d,i)=>{ if(i>cnt) return; const s=data.slice(Math.max(0,i-4),i+1).reduce((a,b)=>a+b.c,0)/Math.min(5,i+1); ma+=(ma?"L":"M")+(x+i*cw+cw/2)+","+sy(s)+" "});
  o+=`<path d="${ma}" fill="none" stroke="#2F6FD0" stroke-width="4" stroke-linejoin="round" opacity=".85"/>`;
  const last=data[Math.min(cnt,n-1)];
  o+=`<g transform="translate(${x+w+6},${sy(last.c)})"><path d="M0,0 L14,-16 H80 V16 H14Z" fill="${last.c>=last.o?GREEN:CORAL}"/>${plain((Math.round(last.c*10)/10)+"",44,7,22,"#fff")}</g>`;
  return o;}
function ticker(t,y,items,col){let o=`<rect x="0" y="${y-34}" width="1080" height="68" fill="${NAVY}"/>`;const txt=items.join("      ");const off=(t*120)%1400;
  o+=`<g transform="translate(${-off},0)">${plain(txt+"      "+txt,0,y+11,30,col||"#fff","start")}</g>`;return o;}
function flagship(x,y,s,ang){const cw=Math.cos(ang);
  return `<g transform="translate(${x},${y}) scale(${s})">${sh(130,16,0,250)}<g transform="scale(${cw},1)">
   <rect x="-110" y="-230" width="220" height="460" rx="42" fill="#1F232C"/><rect x="-104" y="-224" width="208" height="448" rx="37" fill="url(#gp)"/>
   <rect x="-92" y="-212" width="108" height="108" rx="28" fill="#171A21"/>
   ${[[-64,-178],[-28,-178],[-46,-140]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="19" fill="#0C0E12"/><circle cx="${a}" cy="${b}" r="14" fill="#2A3140"/><circle cx="${a}" cy="${b}" r="7" fill="#0A0C10"/><circle cx="${a-4}" cy="${b-5}" r="3" fill="#7FA6FF" opacity=".8"/>`).join("")}
